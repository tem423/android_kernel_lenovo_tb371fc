name: Add GLINK Debug v2

on:
  workflow_dispatch:

jobs:
  add-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Add detailed GLINK debug
        run: |
          python3 << 'PYEOF'
          with open("drivers/rpmsg/qcom_glink_native.c", "r") as f:
              content = f.read()
          
          # 1. In qcom_glink_rx_open, add debug at the very start to log every incoming open
          old_rx_open = 'static int qcom_glink_rx_open(struct qcom_glink *glink, unsigned int rcid,\n\t\t\t      char *name)\n{\n\tstruct glink_channel *channel;\n\tstruct rpmsg_device *rpdev;\n\tbool create_device = false;'
          new_rx_open = 'static int qcom_glink_rx_open(struct qcom_glink *glink, unsigned int rcid,\n\t\t\t      char *name)\n{\n\tstruct glink_channel *channel;\n\tstruct rpmsg_device *rpdev;\n\tbool create_device = false;\n\tpr_info("glink_rx_open: name=%s rcid=%u edge=%s\\n", name ? name : "NULL", rcid, glink->name ? glink->name : "unknown");'
          
          content = content.replace(old_rx_open, new_rx_open, 1)
          
          # 2. In qcom_glink_native_probe, log the edge name
          old_probe = 'glink->name = name;'
          new_probe = 'glink->name = name;\n\tpr_info("glink_native_probe: edge=%s dev=%s\\n", name ? name : "NULL", dev_name(dev));'
          
          content = content.replace(old_probe, new_probe, 1)
          
          # 3. Keep existing intr debug but make it print for all OPEN commands
          old_intr = 'if (cmd == GLINK_CMD_OPEN)\n\t\t\tpr_info("glink_intr: GLINK_CMD_OPEN param1=%u param2=%u\\n", param1, param2);'
          new_intr = 'if (cmd == GLINK_CMD_OPEN)\n\t\t\tpr_info("glink_intr: OPEN rcid=%u param2=%u\\n", param1, param2);'
          
          content = content.replace(old_intr, new_intr, 1)
          
          with open("drivers/rpmsg/qcom_glink_native.c", "w") as f:
              f.write(content)
          
          checks = [
              ("glink_rx_open: name=" in content, "rx_open debug"),
              ("glink_native_probe: edge=" in content, "native_probe debug"),
              ("glink_intr: OPEN rcid=" in content, "intr debug"),
              ("glink_work: GLINK_CMD_OPEN" in content, "work debug"),
          ]
          for ok, label in checks:
              print(f"{'OK' if ok else 'FAIL'}: {label}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git diff --cached --stat
          git commit -m "Add GLINK debug: channel name in rx_open + edge name in probe" || echo "No changes"
          git push origin test-audio-fix
