name: Replace techpack audio
on:
  workflow_dispatch:
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Replace techpack/audio
        run: |
          git remote add eddie https://github.com/Eddie07/android_kernel_tb128fu.git
          git fetch eddie lineage-20.0
          
          rm -rf techpack/audio/*
          git archive eddie/lineage-20.0 -- techpack/audio | tar -x -C techpack/audio/
          
          echo "=== Files copied ==="
          find techpack/audio -maxdepth 2 -type f | wc -l
          
          git add -A
          git diff --cached --stat
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git commit -m "Replace techpack/audio with Eddie07 lineage-20.0 version" || echo "No changes"
          git push origin audio
