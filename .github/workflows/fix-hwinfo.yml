name: Pick hwinfo changes
on:
  workflow_dispatch:
jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Apply hwinfo changes
        run: |
          python3 << 'PYEOF'
          # 1. hqsysfs.h: add HWID_SMARTPA, HWID_AUDIO_CODEC
          with open("include/linux/hqsysfs.h", "r") as f:
              h = f.read()
          h = h.replace("\tHWID_AUDIO,\n", "\tHWID_AUDIO,\n\tHWID_SMARTPA,\n\tHWID_AUDIO_CODEC,\n")
          with open("include/linux/hqsysfs.h", "w") as f:
              f.write(h)
          print("hqsysfs.h done")

          # 2. hqsysfs.c: replace audio_PA with smartpa+audio_codec
          with open("drivers/misc/hqsysfs/hqsysfs.c", "r") as f:
              c = f.read()
          c = c.replace("static HW_INFO(HWID_AUDIO, audio_PA);", "static HW_INFO(HWID_SMARTPA, smartpa);\nstatic HW_INFO(HWID_AUDIO_CODEC, audio_codec);")
          c = c.replace("&hw_info_audio_PA.attr,", "&hw_info_smartpa.attr,\n\t&hw_info_audio_codec.attr,")
          with open("drivers/misc/hqsysfs/hqsysfs.c", "w") as f:
              f.write(c)
          print("hqsysfs.c done")

          # 3. hardware_info.c: add show functions and attrs
          with open("drivers/misc/huaqinhardware_info/hardware_info.c", "r") as f:
              hw = f.read()
          # Add show_audio_codec and show_tfa98xx before show_smartpa_type
          old_func = "static ssize_t show_smartpa_type"
          new_func = """static ssize_t show_audio_codec_type(struct device *dev, struct device_attribute *attr, char *buf)
{
    if (hwinfo_data.audio_codec != NULL)
        return sprintf(buf, "audio_codec:%s\\n", hwinfo_data.audio_codec);
    return sprintf(buf, "audio_codec:Not_found\\n");
}

static ssize_t show_tfa98xx_type(struct device *dev, struct device_attribute *attr, char *buf)
{
    if (hwinfo_data.tfa98xx != NULL)
        return sprintf(buf, "tfa98xx:%s\\n", hwinfo_data.tfa98xx);
    return sprintf(buf, "tfa98xx:Not_found\\n");
}

static ssize_t show_smartpa_type"""
          hw = hw.replace(old_func, new_func, 1)

          # Add DEVICE_ATTR entries
          old_devattr = "static DEVICE_ATTR(smartpa, 0444, show_smartpa_type, NULL);"
          new_devattr = """static DEVICE_ATTR(smartpa, 0444, show_smartpa_type, NULL);
static DEVICE_ATTR(audio_codec, 0444, show_audio_codec_type, NULL);
static DEVICE_ATTR(tfa98xx, 0444, show_tfa98xx_type, NULL);"""
          hw = hw.replace(old_devattr, new_devattr, 1)

          # Add to attribute group
          old_attr = "&dev_attr_smartpa.attr,\n"
          new_attr = "&dev_attr_smartpa.attr,\n    &dev_attr_audio_codec.attr,\n    &dev_attr_tfa98xx.attr,\n"
          hw = hw.replace(old_attr, new_attr, 1)

          with open("drivers/misc/huaqinhardware_info/hardware_info.c", "w") as f:
              f.write(hw)
          print("hardware_info.c done")
          PYEOF

          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git diff --cached --stat
          git commit -m "Add HWID_SMARTPA, HWID_AUDIO_CODEC, audio_codec, tfa98xx to hwinfo drivers" || echo "No changes"
          git push origin audio
