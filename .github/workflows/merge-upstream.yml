name: Merge Android Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo (owner/repo)'
        required: true
        default: 'ila-embsys/linux-android-msm-lenovo-p12'
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'android-4.19-stable'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android14
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream ${{ github.event.inputs.upstream_branch }} --depth=50

      - name: Create merge branch
        run: |
          git checkout -b merge-android-upstream

      - name: Merge
        run: |
          git merge upstream/${{ github.event.inputs.upstream_branch }} --no-edit --allow-unrelated-histories || true
          git add -A
          git commit -m "Merge Android upstream ${{ github.event.inputs.upstream_branch }} from ${{ github.event.inputs.upstream_repo }}" --allow-empty

      - name: Push
        run: |
          git push origin merge-android-upstream
