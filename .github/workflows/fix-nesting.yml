name: Fix nesting
on:
  push:
    branches: [audio]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Fix
        run: |
          if [ -d techpack/audio/techpack/audio ]; then
            rm -rf techpack/audio/*
            git remote add eddie https://github.com/Eddie07/android_kernel_tb128fu.git
            git fetch eddie lineage-20.0
            git checkout eddie/lineage-20.0 -- techpack/audio
            echo "Fixed"
          else
            echo "No nesting"
          fi
          ls techpack/audio/
          ls techpack/audio/ipc/ 2>/dev/null | head -3

      - name: Push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Fix techpack/audio nesting" || echo "No changes"
          git push origin audio
