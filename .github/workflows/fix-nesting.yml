name: Fix SND_JACK defines
on:
  push:
    branches: [audio]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1
      - name: Add missing jack defines
        run: |
          python3 << 'PYEOF'
          f = "include/sound/jack.h"
          with open(f) as fh: c = fh.read()
          
          if "SND_JACK_MICROPHONE2" not in c:
              # Add after SND_JACK_MICROPHONE
              c = c.replace(
                  "SND_JACK_MICROPHONE\t= 0x0002,",
                  "SND_JACK_MICROPHONE\t= 0x0002,\n\tSND_JACK_MICROPHONE2\t= 0x0040,\n\tSND_JACK_ANC_HEADPHONE\t= 0x0080,"
              )
              with open(f, "w") as fh: fh.write(c)
              print("Added SND_JACK_MICROPHONE2 and SND_JACK_ANC_HEADPHONE")
          else:
              print("Already present")
          
          with open(f) as fh: c2 = fh.read()
          print(f"MICROPHONE2: {'YES' if 'SND_JACK_MICROPHONE2' in c2 else 'NO'}")
          print(f"ANC_HEADPHONE: {'YES' if 'SND_JACK_ANC_HEADPHONE' in c2 else 'NO'}")
          PYEOF
      - name: Push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Add SND_JACK_MICROPHONE2 and SND_JACK_ANC_HEADPHONE defines" || echo "No changes"
          git push origin audio
