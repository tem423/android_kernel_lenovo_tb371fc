name: Fix techpack audio nesting
on:
  push:
    branches: [audio]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Fix
        run: |
          # Remove the wrongly nested path
          rm -rf techpack/audio/*
          
          # Extract to repo root (preserving techpack/audio/ prefix)
          git remote add eddie https://github.com/Eddie07/android_kernel_tb128fu.git
          git fetch eddie lineage-20.0
          git archive eddie/lineage-20.0 -- techpack/audio | tar -x
          
          echo "=== Verify ==="
          ls techpack/audio/
          ls techpack/audio/ipc/ | head -5
          ls techpack/audio/soc/ | head -5

      - name: Push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git diff --cached --stat
          git commit -m "Fix techpack/audio structure from Eddie07 lineage-20.0" || echo "No changes"
          git push origin audio
