name: Add rpmsg match detail debug
on:
  workflow_dispatch:
jobs:
  add-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Add detailed match debug
        run: |
          python3 << 'PYEOF'
          with open("drivers/rpmsg/rpmsg_core.c", "r") as f:
              content = f.read()
          
          # Replace the existing apr_audio_svc debug with detailed version
          old = '\tif (!strncmp(rpdev->id.name, "apr_audio_svc", 13))\n\t\tpr_info("rpmsg_match: dev=%s drv=%s\\n", dev_name(dev), drv->name);'
          
          new = '\tif (!strncmp(rpdev->id.name, "apr_audio_svc", 13)) {\n\t\tpr_info("rpmsg_match: dev=%s drv=%s ids=%p id_table0=%s override=%p\\n",\n\t\t\tdev_name(dev), drv->name, ids,\n\t\t\tids && ids[0].name[0] ? ids[0].name : \"(empty)\",\n\t\t\trpdev->driver_override);\n\t}'
          
          content = content.replace(old, new, 1)
          
          # Also add return value debug after the id_table loop
          old2 = '\treturn of_driver_match_device(dev, drv);\n}'
          new2 = '\t{\n\t\tint _ret = of_driver_match_device(dev, drv);\n\t\tif (!strncmp(rpdev->id.name, "apr_audio_svc", 13))\n\t\t\tpr_info("rpmsg_match: apr_audio_svc falling to OF match, result=%d\\n", _ret);\n\t\treturn _ret;\n\t}\n}'
          
          content = content.replace(old2, new2, 1)
          
          with open("drivers/rpmsg/rpmsg_core.c", "w") as f:
              f.write(content)
          
          if "id_table0=" in content:
              print("OK: detailed match debug added")
          else:
              print("FAIL: detailed match debug not found")
          if "falling to OF match" in content:
              print("OK: OF fallback debug added")
          else:
              print("FAIL: OF fallback debug not found")
          PYEOF
      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Add detailed debug: id_table pointer and OF fallback for apr_audio_svc" || echo "No changes"
          git push origin test-audio-fix
