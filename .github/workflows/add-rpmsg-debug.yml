name: Full rpmsg debug - one shot
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Add ALL debug to rpmsg_core.c and apr_tal_rpmsg.c
        run: |
          python3 << 'PYEOF'
          # ===== rpmsg_core.c =====
          with open("drivers/rpmsg/rpmsg_core.c", "r") as f:
              rc = f.read()

          # Replace rpmsg_dev_match with fully instrumented version
          old = '''static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)
\t{
\t\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);
\t\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);
\t\tconst struct rpmsg_device_id *ids = rpdrv->id_table;
\t\tunsigned int i;

\t\tif (!strncmp(rpdev->id.name, "apr_audio_svc", 13)) {
\t\t\tpr_info("rpmsg_match: dev=%s drv=%s ids=%p id_table0=%s override=%p\\n",
\t\t\t\tdev_name(dev), drv->name, ids,
\t\t\t\tids && ids[0].name[0] ? ids[0].name : "(empty)",
\t\t\t\trpdev->driver_override);
\t\t}

\t\tif (rpdev->driver_override)
\t\t\treturn !strcmp(rpdev->driver_override, drv->name);'''

          new = '''static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)
\t{
\t\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);
\t\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);
\t\tconst struct rpmsg_device_id *ids = rpdrv->id_table;
\t\tunsigned int i;
\t\tint apr = !strncmp(rpdev->id.name, "apr_audio_svc", 13);

\t\tif (apr)
\t\t\tpr_info("apr_match: dev=%s drv=%s ids=%p drv_name=%s\\n",
\t\t\t\tdev_name(dev), drv->name, ids, rpdrv->drv.name);

\t\tif (rpdev->driver_override) {
\t\t\tint r = !strcmp(rpdev->driver_override, drv->name);
\t\t\tif (apr) pr_info("apr_match: override check result=%d\\n", r);
\t\t\treturn r;
\t\t}'''

          if old in rc:
              rc = rc.replace(old, new, 1)
              print("OK: rpmsg_dev_match replaced")
          else:
              print("WARN: rpmsg_dev_match old text not found, trying simpler replace")
              # Fallback: just replace the function header
              old2 = 'static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)\n{\n\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);\n\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);\n\tconst struct rpmsg_device_id *ids = rpdrv->id_table;\n\tunsigned int i;'
              new2 = '''static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)
\t{
\t\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);
\t\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);
\t\tconst struct rpmsg_device_id *ids = rpdrv->id_table;
\t\tunsigned int i;
\t\tint apr = !strncmp(rpdev->id.name, "apr_audio_svc", 13);
\t\tif (apr) pr_info("apr_match: dev=%s drv=%s ids=%p drv_name=%s\\n", dev_name(dev), drv->name, ids, rpdrv->drv.name);'''
              rc = rc.replace(old2, new2, 1)

          # Replace the id_table loop to add debug
          old_loop = '\t\tif (rpmsg_id_match(rpdev, &ids[i]))\n\t\t\treturn 1;'
          new_loop = '''\t\tif (rpmsg_id_match(rpdev, &ids[i])) {
\t\t\tif (apr) pr_info("apr_match: id_table match found at i=%u name=%s\\n", i, ids[i].name);
\t\t\treturn 1;
\t\t}
\t\tif (apr) pr_info("apr_match: id_table miss i=%u name=%s devname=%s\\n", i, ids[i].name, rpdev->id.name);'''
          rc = rc.replace(old_loop, new_loop, 1)

          # Replace OF fallback to add debug
          old_of = '\treturn of_driver_match_device(dev, drv);\n}'
          new_of = '''\t{
\t\tint _r = of_driver_match_device(dev, drv);
\t\tif (apr) pr_info("apr_match: OF match result=%d\\n", _r);
\t\treturn _r;
\t}
}'''
          rc = rc.replace(old_of, new_of, 1)

          with open("drivers/rpmsg/rpmsg_core.c", "w") as f:
              f.write(rc)

          checks = [("apr_match:" in rc, "rpmsg_dev_match debug"),
                     ("apr_match: id_table miss" in rc, "id_table miss debug"),
                     ("apr_match: OF match" in rc, "OF fallback debug")]
          for ok, label in checks:
              print(f"{'OK' if ok else 'FAIL'}: {label}")

          # ===== apr_tal_rpmsg.c =====
          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "r") as f:
              ac = f.read()

          # Add debug at probe entry
          old_probe = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;'
          new_probe = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;\n  \tpr_info("apr_tal_rpmsg_probe: ENTER name=%s parent=%s\\n", rpdev->id.name, dev_name(&rpdev->dev.parent->dev));'
          ac = ac.replace(old_probe, new_probe, 1)

          # Add debug at mbox-names read result
          old_mbox = 'ret = of_property_read_string(rpdev->dev.parent->of_node,\n  \t\t\t\t   "mbox-names", &dest);\n  \n  \tif(ret < 0){\n  \t\tpr_err("%s no parent source pid found\\n", __func__);'
          new_mbox = 'ret = of_property_read_string(rpdev->dev.parent->of_node,\n  \t\t\t\t   "mbox-names", &dest);\n  \n  \tpr_info("apr_tal_rpmsg_probe: mbox-names ret=%d dest=%s\\n", ret, ret==0 ? dest : "NULL");\n  \tif(ret < 0){\n  \t\tpr_err("%s no parent source pid found\\n", __func__);'
          ac = ac.replace(old_mbox, new_mbox, 1)

          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "w") as f:
              f.write(ac)

          apr_checks = [("apr_tal_rpmsg_probe: ENTER" in ac, "probe entry"),
                        ("mbox-names ret=" in ac, "mbox debug")]
          for ok, label in apr_checks:
              print(f"{'OK' if ok else 'FAIL'}: {label}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git diff --cached --stat
          git commit -m "Full debug: rpmsg match internals + apr_tal_rpmsg probe entry" || echo "No changes"
          git push origin test-audio-fix
