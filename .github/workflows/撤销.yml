name: Revert with Conflict Handling

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}  # ✅ token 放在这里

      - name: 配置 Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: 尝试 revert
        id: revert_step
        continue-on-error: true
        run: |
          git revert 5d65d87 --no-edit
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 检查结果并推送
        run: |
          if [ "${{ steps.revert_step.outputs.status }}" == "success" ]; then
            echo "✅ Revert 成功，推送中..."
            git push origin ${{ github.event.inputs.branch }}
          else
            echo "⚠️ 发生冲突，请手动解决"
            git status
            git diff --name-only --diff-filter=U
            exit 1
          fi