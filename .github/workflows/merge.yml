name: Merge upstream v4.19.325

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to merge into (e.g. main or master)'
        required: true
        default: '合并'
      upstream_tag:
        description: 'Upstream tag to merge'
        required: true
        default: 'v4.19.325'

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream remote and fetch tags
      run: |
        git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git || true
        git fetch upstream --tags

    - name: Prepare variables
      id: vars
      run: |
        echo "BASE=${{ github.event.inputs.base_branch }}" >> $GITHUB_OUTPUT
        echo "TAG=${{ github.event.inputs.upstream_tag }}" >> $GITHUB_OUTPUT
        BRANCH_NAME="merge-${{ github.event.inputs.upstream_tag }}-into-${{ github.event.inputs.base_branch }}-$(date +%Y%m%d%H%M%S)"
        echo "BRANCH=${BRANCH_NAME}" >> $GITHUB_OUTPUT

    - name: Create merge branch from base
      run: |
        git fetch origin ${{ github.event.inputs.base_branch }} --depth=1 || true
        git checkout -b "${{ steps.vars.outputs.BRANCH }}" "origin/${{ github.event.inputs.base_branch }}"

    - name: Attempt merge from upstream
      id: attempt_merge
      run: |
        set -e
        # fetch the tag from upstream
        git fetch --depth=1 upstream "refs/tags/${{ steps.vars.outputs.TAG }}:refs/tags/${{ steps.vars.outputs.TAG }}" || true
        if git rev-parse "refs/tags/${{ steps.vars.outputs.TAG }}" >/dev/null 2>&1; then
          echo "Found upstream tag ${{ steps.vars.outputs.TAG }}"
        else
          echo "Upstream tag ${{ steps.vars.outputs.TAG }} not found; aborting"
          exit 1
        fi
        if ! git merge --no-ff -m "Merge upstream ${{ steps.vars.outputs.TAG }}" "refs/tags/${{ steps.vars.outputs.TAG }}"; then
          echo "merge_conflict=true" >> $GITHUB_ENV
        fi

    - name: Push branch and create PR
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        BRANCH: ${{ steps.vars.outputs.BRANCH }}
        BASE: ${{ steps.vars.outputs.BASE }}
        TAG: ${{ steps.vars.outputs.TAG }}
      run: |
        if [ -z "$PAT_TOKEN" ]; then
          echo "ERROR: repository secret PAT_TOKEN is not set. Please add a PAT with repo permissions to the repository secrets named PAT_TOKEN."
          exit 1
        fi

        # push branch (include token in remote URL)
        git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}"
        git push origin "HEAD:${BRANCH}" --force

        # prepare PR body
        if [ "${merge_conflict}" = "true" ]; then
          TITLE="WIP: Merge upstream ${TAG} (conflicts)"
          BODY="This attempted merge of upstream ${TAG} into ${BASE} produced merge conflicts and has been pushed to branch ${BRANCH} for manual resolution. Please inspect the branch, resolve conflicts, and update the branch.\n\nChecks to perform:\n- Build the kernel for target\n- Verify boot and device-specific peripherals (display, audio, sensors)\n- Document decisions for each resolved conflict."
          DRAFT=true
        else
          TITLE="Merge upstream ${TAG}"
          BODY="This branch contains a clean merge of upstream ${TAG} into ${BASE}. Please review, run CI/build tests and merge when ready.\n\nChecklist:\n- Build passes\n- Device boots and key peripherals work\n- Conflicts (if any) documented"
          DRAFT=false
        fi

        # create PR via GitHub API using curl + jq
        API_URL="https://api.github.com/repos/${{ github.repository }}/pulls"
        PAYLOAD=$(jq -n --arg title "$TITLE" --arg head "$BRANCH" --arg base "$BASE" --arg body "$BODY" --argjson draft $DRAFT '{title: $title, head: $head, base: $base, body: $body, draft: $draft}')
        echo "Creating PR: $TITLE"
        RESPONSE=$(curl -s -H "Authorization: token ${PAT_TOKEN}" -H "Accept: application/vnd.github+json" "$API_URL" -d "$PAYLOAD")
        echo "$RESPONSE" | jq '.html_url // .message' > pr_url.txt
        echo "PR result:"
        cat pr_url.txt

    - name: Show summary and instructions
      if: always()
      run: |
        echo "Merge job finished. If the PR was created, its URL is in pr_url.txt in the workspace output."