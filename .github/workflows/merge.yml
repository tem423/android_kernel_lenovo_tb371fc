name: Precise Merge Android Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo (owner/repo)'
        required: true
        default: 'tem423/android_kernel_lenovo_tb371fc'
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'android16-base'
      source_branch:
        description: 'Source branch to merge from'
        required: true
        default: 'main'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "tem423@users.noreply.github.com"
          git config --global user.name "tem423"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Create merge branch and merge (ours on conflict)
        run: |
          git checkout -b merge-android-upstream
          UPSTREAM_REF="upstream/${{ github.event.inputs.upstream_branch }}"

          if git merge-base HEAD "$UPSTREAM_REF" >/dev/null 2>&1; then
            git merge "$UPSTREAM_REF" --no-edit -X ours
          else
            echo "无共同历史，使用 --allow-unrelated-histories"
            git merge "$UPSTREAM_REF" --no-edit --allow-unrelated-histories -X ours
          fi

      - name: Verify no conflict markers remain
        run: |
          echo "=== 检查残留冲突标记 ==="
          if grep -rl "^<<<<<<< " . --exclude-dir=.git 2>/dev/null; then
            echo "❌ 仍有冲突标记，中止"
            exit 1
          fi
          echo "✅ 无冲突标记"

      - name: Push merged branch
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin merge-android-upstream --force