name: Precise Merge Android Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo (owner/repo)'
        required: true
        default: 'tem423/android_kernel_lenovo_tb371fc'
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'android16-base'
      source_branch:
        description: 'Source branch to merge from'
        required: true
        default: 'main'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "tem423@users.noreply.github.com"
          git config --global user.name "tem423"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git || true
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Create merge branch and merge (ours on conflict)
        run: |
          git checkout -b merge-android-upstream
          UPSTREAM_REF="upstream/${{ github.event.inputs.upstream_branch }}"

          if git merge-base HEAD "$UPSTREAM_REF" >/dev/null 2>&1; then
            git merge "$UPSTREAM_REF" --no-edit -X ours || true
          else
            echo "无共同历史，使用 --allow-unrelated-histories"
            git merge "$UPSTREAM_REF" --no-edit --allow-unrelated-histories -X ours || true
          fi

          # merge 失败会残留 index.lock，这里清掉
          rm -f .git/index.lock

      - name: Resolve file/directory conflicts (keep upstream file)
        run: |
          set +e
          UPSTREAM_REF="upstream/${{ github.event.inputs.upstream_branch }}"

          # 清掉可能残留的 git 进程与锁
          pkill -f git || true
          sleep 1
          rm -f .git/index.lock

          # 1) 删除结构冲突产生的 ~HEAD 备份目录
          find . -name '*~HEAD' -not -path './.git/*' -exec rm -rf {} + 2>/dev/null
          rm -f .git/index.lock

          # 2) 记录冲突路径
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt 2>/dev/null
          rm -f .git/index.lock

          # 3) 找出"工作区是目录、upstream 是文件"的路径
          TO_CHECKOUT=""
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -d "$f" ] && git cat-file -e "$UPSTREAM_REF:$f" 2>/dev/null; then
              echo "目录->文件: $f"
              rm -rf "$f"
              TO_CHECKOUT="$TO_CHECKOUT $f"
            fi
          done < /tmp/conflicts.txt

          # 4) 批量检出 upstream 文件
          if [ -n "$TO_CHECKOUT" ]; then
            rm -f .git/index.lock
            git checkout "$UPSTREAM_REF" -- $TO_CHECKOUT
            rm -f .git/index.lock
          fi

          # 5) 剩余 unmerged 按 ours 收尾
          git diff --name-only --diff-filter=U > /tmp/remaining.txt 2>/dev/null
          rm -f .git/index.lock

          while read -r f; do
            [ -z "$f" ] && continue
            if [ -d "$f" ]; then
              rm -rf "$f"
              if git cat-file -e "$UPSTREAM_REF:$f" 2>/dev/null; then
                git checkout "$UPSTREAM_REF" -- "$f"
              fi
            else
              git checkout --ours -- "$f" 2>/dev/null || git add "$f" 2>/dev/null
            fi
            rm -f .git/index.lock
          done < /tmp/remaining.txt

          # 6) 全部加入 index
          rm -f .git/index.lock
          git add -A
          rm -f .git/index.lock

      - name: Verify no conflict markers remain
        run: |
          echo "=== 检查残留冲突标记 ==="
          if grep -rl "^<<<<<<< " . --exclude-dir=.git 2>/dev/null; then
            echo "❌ 仍有冲突标记，中止"
            exit 1
          fi
          echo "✅ 无冲突标记"

      - name: Commit merge
        run: |
          rm -f .git/index.lock
          git commit -m "Merge Android upstream ${{ github.event.inputs.upstream_branch }}" --allow-empty

      - name: Push merged branch
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin merge-android-upstream --force