name: Full Rpmsg Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Add ALL debug to rpmsg_core.c and apr_tal_rpmsg.c
        run: |
          python3 << 'PYEOF'
          # ===== rpmsg_core.c =====
          with open("drivers/rpmsg/rpmsg_core.c", "r") as f:
              rc = f.read()

          # Replace rpmsg_dev_match with fully instrumented version
          old = 'static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)\n\t{\n\t\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);\n\t\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);\n\t\tconst struct rpmsg_device_id *ids = rpdrv->id_table;\n\t\tunsigned int i;\n\n\t\tif (!strncmp(rpdev->id.name, "apr_audio_svc", 13)) {\n\t\t\tpr_info("rpmsg_match: dev=%s drv=%s ids=%p id_table0=%s override=%p\\n",\n\t\t\t\tdev_name(dev), drv->name, ids,\n\t\t\t\tids && ids[0].name[0] ? ids[0].name : "(empty)",\n\t\t\t\trpdev->driver_override);\n\t\t}\n\n\t\tif (rpdev->driver_override)\n\t\t\treturn !strcmp(rpdev->driver_override, drv->name);'

          new = 'static int rpmsg_dev_match(struct device *dev, struct device_driver *drv)\n\t{\n\t\tstruct rpmsg_device *rpdev = to_rpmsg_device(dev);\n\t\tstruct rpmsg_driver *rpdrv = to_rpmsg_driver(drv);\n\t\tconst struct rpmsg_device_id *ids = rpdrv->id_table;\n\t\tunsigned int i;\n\t\tint apr = !strncmp(rpdev->id.name, "apr_audio_svc", 13);\n\n\t\tif (apr)\n\t\t\tpr_info("apr_match: dev=%s drv=%s ids=%p drv_name=%s\\n", dev_name(dev), drv->name, ids, rpdrv->drv.name);\n\n\t\tif (rpdev->driver_override)\n\t\t\treturn !strcmp(rpdev->driver_override, drv->name);'

          rc = rc.replace(old, new, 1)

          # Add debug inside id_table loop
          old_loop = '\t\tif (rpmsg_id_match(rpdev, &ids[i]))\n\t\t\treturn 1;'
          new_loop = '\t\tif (rpmsg_id_match(rpdev, &ids[i])) {\n\t\t\tif (apr) pr_info("apr_match: HIT i=%u ids_name=%s dev_name=%s\\n", i, ids[i].name, rpdev->id.name);\n\t\t\treturn 1;\n\t\t}\n\t\tif (apr) pr_info("apr_match: MISS i=%u ids_name=%s dev_name=%s\\n", i, ids[i].name, rpdev->id.name);'
          rc = rc.replace(old_loop, new_loop, 1)

          # Add debug at OF fallback
          old_of = '\treturn of_driver_match_device(dev, drv);\n}'
          new_of = '\t{\n\t\tint _r = of_driver_match_device(dev, drv);\n\t\tif (apr) pr_info("apr_match: OF_fallback=%d\\n", _r);\n\t\treturn _r;\n\t}\n}'
          rc = rc.replace(old_of, new_of, 1)

          with open("drivers/rpmsg/rpmsg_core.c", "w") as f:
              f.write(rc)
          print("rpmsg_core.c done:", "apr_match:" in rc, "MISS" in rc, "OF_fallback" in rc)

          # ===== apr_tal_rpmsg.c =====
          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "r") as f:
              ac = f.read()

          old_probe = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;'
          new_probe = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;\n  \tpr_info("apr_tal_rpmsg_probe: ENTER name=%s\\n", rpdev->id.name);'
          ac = ac.replace(old_probe, new_probe, 1)

          old_mbox = 'ret = of_property_read_string(rpdev->dev.parent->of_node,\n  \t\t\t\t   "mbox-names", &dest);\n  \n  \tif(ret < 0){'
          new_mbox = 'ret = of_property_read_string(rpdev->dev.parent->of_node,\n  \t\t\t\t   "mbox-names", &dest);\n  \tpr_info("apr_tal_rpmsg_probe: mbox ret=%d dest=%s\\n", ret, ret==0 ? dest : "NULL");\n  \n  \tif(ret < 0){'
          ac = ac.replace(old_mbox, new_mbox, 1)

          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "w") as f:
              f.write(ac)
          print("apr_tal_rpmsg.c done:", "ENTER" in ac, "mbox ret=" in ac)
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git diff --cached --stat
          git commit -m "Full debug: rpmsg match internals + apr_tal probe entry" || echo "No changes"
          git push origin test-audio-fix
