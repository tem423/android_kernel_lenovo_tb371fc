name: Fix broken core.h symlink
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-test
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Replace broken symlink with actual file
        run: |
          rm -f techpack/audio/soc/core.h
          cp drivers/pinctrl/core.h techpack/audio/soc/core.h
          
          echo "=== Verify ==="
          ls -la techpack/audio/soc/core.h
          head -3 techpack/audio/soc/core.h
          
          git add -A
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git commit -m "Replace broken core.h symlink with actual file content" || echo "No changes"
          git push origin audio-test
