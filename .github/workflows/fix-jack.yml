name: Fix all broken symlinks in audio-techpack
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-test
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Find and fix all broken symlinks
        run: |
          echo "=== Finding broken symlinks ==="
          find techpack/audio -type l | while read link; do
            target=$(readlink "$link")
            if [ ! -e "$link" ]; then
              echo "BROKEN: $link -> $target"
              
              # Try to find the target in the kernel source tree
              basename=$(basename "$target")
              found=$(find drivers/ include/ -name "$basename" 2>/dev/null | head -1)
              
              if [ -n "$found" ]; then
                echo "  FOUND: $found"
                rm "$link"
                cp "$found" "$link"
                echo "  FIXED"
              else
                echo "  NOT FOUND - removing symlink"
                rm "$link"
                echo "  REMOVED"
              fi
            fi
          done
          
          echo "=== Summary ==="
          git diff --stat
          git add -A
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git commit -m "Fix all broken symlinks in audio-techpack" || echo "No changes"
          git push origin audio-test
