name: Fix core.h not found
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-test
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Add soc/ to include path in audio Makefile
        run: |
          FILE="techpack/audio/Makefile"
          
          # Add soc/ include path after the existing include/uapi path
          sed -i '/-I$(srctree)\/techpack\/audio\/include$/a LINUXINCLUDE    += \\\n                -I$(srctree)/techpack/audio/soc' "$FILE"
          
          echo "=== Verify ==="
          grep -n "soc\|LINUXINCLUDE" "$FILE" | head -20
          
          git add -A
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git commit -m "Add soc/ to include path to fix core.h not found" || echo "No changes"
          git push origin audio-test
