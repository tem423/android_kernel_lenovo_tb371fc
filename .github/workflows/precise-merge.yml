name: Precise Merge Android Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo (owner/repo)'
        required: true
        default: 'ila-embsys/linux-android-msm-lenovo-p12'
      upstream_branch:
        description: 'Upstream branch'
        required: true
        default: 'android-4.19-stable'
      source_branch:
        description: 'Source branch to merge from'
        required: true
        default: 'android14'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "tem423@users.noreply.github.com"
          git config --global user.name "tem423"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Create merge branch and merge
        run: |
          git checkout -b merge-android-upstream
          git merge upstream/${{ github.event.inputs.upstream_branch }} --no-edit || true

      - name: Show conflicts
        run: |
          echo "=== Files with conflict markers ==="
          grep -rl "<<<<<<< HEAD" --include="*.c" --include="*.h" . 2>/dev/null | head -50 || echo "No conflict markers"
          echo ""
          echo "=== Unmerged files ==="
          git diff --name-only --diff-filter=U 2>/dev/null | head -50 || echo "None"

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Merge Android upstream ${{ github.event.inputs.upstream_branch }}" --allow-empty
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin merge-android-upstream --force
