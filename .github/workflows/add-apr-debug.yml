name: Add apr_tal_rpmsg debug
on:
  workflow_dispatch:
jobs:
  add-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Add debug to apr_tal_rpmsg_probe
        run: |
          python3 << 'PYEOF'
          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "r") as f:
              content = f.read()
          
          # Add debug at probe entry
          old = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;'
          new = 'static int apr_tal_rpmsg_probe(struct rpmsg_device *rpdev)\n  {\n  \tstruct apr_svc_ch_dev *apr_ch = NULL;\n  \tint ret = 0;\n  \tconst char* dest;\n  \tpr_info("apr_tal_rpmsg_probe: CALLED for %s\\n", rpdev->id.name);'
          
          content = content.replace(old, new, 1)
          
          # Add debug at rpmsg_driver registration
          old2 = 'ret = register_rpmsg_driver(&apr_tal_rpmsg_driver);'
          new2 = 'ret = register_rpmsg_driver(&apr_tal_rpmsg_driver);\n\tpr_info("apr_tal_init: register_rpmsg_driver ret=%d\\n", ret);'
          
          content = content.replace(old2, new2, 1)
          
          with open("techpack/audio/ipc/apr_tal_rpmsg.c", "w") as f:
              f.write(content)
          
          if "apr_tal_rpmsg_probe: CALLED" in content:
              print("OK: probe debug added")
          else:
              print("FAIL: probe debug not found")
          if "apr_tal_init: register_rpmsg_driver ret=%d" in content:
              print("OK: init debug added")
          else:
              print("FAIL: init debug not found")
          PYEOF
      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Add debug to apr_tal_rpmsg_probe entry and module init" || echo "No changes"
          git push origin test-audio-fix
