name: clone

on:
  workflow_dispatch:

jobs:
  sync-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Clone AOSP kernel and force push specific commit as branch
      run: |
        # 1. 完整克隆 AOSP 内核仓库（不限制深度，确保能获取所有历史）
        git clone https://android.googlesource.com/kernel/common kernel-temp
        cd kernel-temp
        
        # 2. 切换到目标提交 g076ac12bde16
        git checkout g076ac12bde16
        
        # 3. 基于这个特定提交创建新分支
        branch_name="aosp-kernel-g076ac12"
        git checkout -b $branch_name
        
        # 4. 设置推送目标为你自己的 GitHub 仓库
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        
        # 5. 删除远程已存在的同名分支（如有），然后强制推送
        git push origin :$branch_name 2>/dev/null || true
        git push origin $branch_name --force
        
        echo "Branch $branch_name synced to commit g076ac12bde16 (from 2025-06-30)"