name: Sync Kernel from Specific Commit

on:
  workflow_dispatch:

jobs:
  sync-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Clone and force push LA.UM.9.12.r1-14900-SMxx50.QSSI13.0 branch
      run: |
        git clone --branch LA.UM.9.12.r1-14900-SMxx50.QSSI13.0 --single-branch https://git.codelinaro.org/clo/la/kernel/msm-4.19.git kernel-temp
        cd kernel-temp
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        git push origin LA.UM.9.12.r1-14900-SMxx50.QSSI13.0 --force