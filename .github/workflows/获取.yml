name: clone

on:
  workflow_dispatch:

jobs:
  sync-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Clone and force push as branch
      run: |
        # 克隆LineageOS内核仓库
        git clone https://git.codelinaro.org/clo/la/platform/vendor/opensource/audio-kernel.git kernel-temp
        cd kernel-temp
        
        # 切换到指定的commit
        git checkout LA.UM.9.12.r1-14900-SMxx50.QSSI13.0
        
        # 创建固定名称的分支（如果存在则先删除）
        branch_name="audio-techpack"
        
        # 删除本地分支（如果存在）
        git branch -D $branch_name 2>/dev/null || true
        
        # 基于当前commit创建新分支
        git checkout -b $branch_name
        
        # 设置你的仓库为远程
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        
        # 删除远程分支（如果存在）
        git push origin :$branch_name 2>/dev/null || true
        
        # 强制推送分支到你的仓库
        git push origin $branch_name --force
        
        echo "Branch $branch_name synced to commit 7236e11edc9a2e258d50e773614ae0153fe303d4"