name: Sync Kernel from Specific Commit

on:
  workflow_dispatch:

jobs:
  sync-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Clone and force push as branch
      run: |
        # 浅克隆，只拉取指定标签，不拉取所有分支
        git clone --depth 1 --branch LA.UM.9.12.r1-14900-SMxx50.QSSI13.0 https://git.codelinaro.org/clo/la/kernel/msm-4.19.git kernel-temp
        cd kernel-temp
        
        # 基于当前标签创建分支（名称保持一致）
        git checkout -b LA.UM.9.12.r1-14900-SMxx50.QSSI13.0
        
        # 设置你的仓库为远程
        git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
        
        # 强制推送分支到你的仓库
        git push origin LA.UM.9.12.r1-14900-SMxx50.QSSI13.0 --force