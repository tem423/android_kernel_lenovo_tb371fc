name: Fix apr_tal_rpmsg binding
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Workaround: fix rpmsg matching for apr_tal_rpmsg
        run: |
          python3 << 'PYEOF'
          with open("drivers/rpmsg/rpmsg_core.c", "r") as f:
              rc = f.read()

          # Find the rpmsg_dev_match function and add workaround
          # After the ids check fails (ids is NULL), add a name-based fallback
          old = '''	if (ids)
		for (i = 0; ids[i].name[0]; i++)
			if (rpmsg_id_match(rpdev, &ids[i]))
				return 1;'''

          new = '''	if (ids)
		for (i = 0; ids[i].name[0]; i++)
			if (rpmsg_id_match(rpdev, &ids[i]))
				return 1;

	/* Workaround: if id_table is NULL due to struct layout mismatch,
	   fall back to name-based matching for known drivers */
	if (!ids && drv->name && rpdev->id.name) {
		if (!strcmp(drv->name, "apr_tal_rpmsg") &&
		    !strcmp(rpdev->id.name, "apr_audio_svc")) {
			pr_warn("rpmsg_match: WORKAROUND matched %s -> %s (ids was NULL)\n",
				rpdev->id.name, drv->name);
			return 1;
		}
	}'''

          if old in rc:
              rc = rc.replace(old, new, 1)
              print("OK: workaround added")
          else:
              print("FAIL: old text not found")

          with open("drivers/rpmsg/rpmsg_core.c", "w") as f:
              f.write(rc)
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Workaround: name-based rpmsg match when id_table is NULL" || echo "No changes"
          git push origin test-audio-fix
