name: Update audio hwinfo
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Apply changes
        run: |
          # hqsysfs.h: add HWID_SMARTPA and HWID_AUDIO_CODEC after HWID_AUDIO
          sed -i 's/\tHWID_AUDIO,/\tHWID_AUDIO,\n\tHWID_SMARTPA,\n\tHWID_AUDIO_CODEC,/' include/linux/hqsysfs.h
          
          # hqsysfs.c: replace HWID_AUDIO with HWID_SMARTPA + HWID_AUDIO_CODEC + tfa98xx
          sed -i 's/static HW_INFO(HWID_AUDIO, audio_PA);/static HW_INFO(HWID_SMARTPA, smartpa);\nstatic HW_INFO(HWID_AUDIO_CODEC, audio_codec);\nstatic HW_INFO(HWID_VIBRATOR, vibrator);/' drivers/misc/hqsysfs/hqsysfs.c
          sed -i 's/\&hw_info_audio_PA\.attr,/\&hw_info_smartpa.attr,\n\t\&hw_info_audio_codec.attr,/' drivers/misc/hqsysfs/hqsysfs.c
          
          # hardware_info.c: add audio_codec and tfa98xx show functions and attrs
          sed -i '/static ssize_t show_smartpa_type/a\
  static ssize_t show_audio_codec_type(struct device *dev, struct device_attribute *attr, char *buf)\n  {\n      if (hwinfo_data.audio_codec != NULL)\n          return sprintf(buf, "audio_codec:%s\\n", hwinfo_data.audio_codec);\n      return sprintf(buf, "audio_codec:Not_found\\n");\n  }\n\n  static ssize_t show_tfa98xx_type(struct device *dev, struct device_attribute *attr, char *buf)\n  {\n      if (hwinfo_data.tfa98xx != NULL)\n          return sprintf(buf, "tfa98xx:%s\\n", hwinfo_data.tfa98xx);\n      return sprintf(buf, "tfa98xx:Not_found\\n");\n  }' drivers/misc/huaqinhardware_info/hardware_info.c
          sed -i '/static DEVICE_ATTR(smartpa/a\static DEVICE_ATTR(audio_codec, 0444, show_audio_codec_type, NULL);\nstatic DEVICE_ATTR(tfa98xx, 0444, show_tfa98xx_type, NULL);' drivers/misc/huaqinhardware_info/hardware_info.c
          sed -i '/\&dev_attr_smartpa\.attr,/a\\    \&dev_attr_audio_codec.attr,\n    \&dev_attr_tfa98xx.attr,' drivers/misc/huaqinhardware_info/hardware_info.c
          
          echo "=== Verify ==="
          grep -n "HWID_SMARTPA\|HWID_AUDIO_CODEC" include/linux/hqsysfs.h
          grep -n "smartpa\|audio_codec\|tfa98xx" drivers/misc/hqsysfs/hqsysfs.c | head -10
          grep -n "show_audio_codec\|show_tfa98xx\|dev_attr_audio_codec\|dev_attr_tfa98xx" drivers/misc/huaqinhardware_info/hardware_info.c | head -10
          
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Add HWID_SMARTPA, HWID_AUDIO_CODEC, audio_codec, tfa98xx entries" || echo "No changes"
          git push origin audio
