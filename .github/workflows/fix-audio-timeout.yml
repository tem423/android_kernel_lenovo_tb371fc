name: Fix Audio Timeout

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-audio-fix
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Fix apr_tal_open timeout
        run: |
          sed -i 's/5 \* HZ/15 * HZ/g' techpack/audio/ipc/apr_tal_rpmsg.c
          git config user.email "tem423@users.noreply.github.com"
          git config user.name "tem423"
          git add -A
          git commit -m "Increase apr_tal_open timeout from 5s to 15s to fix audio probe delay" || true
          git push origin test-audio-fix
