name: Resolve Merge Conflicts

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@v4
        with:
          ref: merge-android-upstream
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "tem423@users.noreply.github.com"
          git config --global user.name "tem423"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ila-embsys/linux-android-msm-lenovo-p12.git
          git fetch upstream android-4.19-stable

      - name: Reset and re-merge with theirs strategy
        run: |
          # Reset to android14 branch state
          git checkout android14
          git checkout -b resolve-conflicts

          # Merge with theirs strategy (prefer upstream for conflicts)
          git merge upstream/android-4.19-stable -X theirs --no-edit || true

      - name: Fix specific files that need manual merge
        run: |
          # These files need special handling - merge both sides
          
          # 1. cpucaps.h - keep both Android and upstream caps
          echo "Checking cpucaps.h..."
          git checkout upstream/android-4.19-stable -- arch/arm64/include/asm/cpucaps.h 2>/dev/null || true
          
          # 2. cpu_errata.c - keep both errata lists
          echo "Checking cpu_errata.c..."
          git checkout upstream/android-4.19-stable -- arch/arm64/kernel/cpu_errata.c 2>/dev/null || true
          
          # 3. f2fs files - merge carefully
          echo "Checking f2fs..."
          git checkout upstream/android-4.19-stable -- fs/f2fs/f2fs.h 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- fs/f2fs/file.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- fs/f2fs/data.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- fs/f2fs/gc.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- fs/f2fs/segment.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- fs/f2fs/xattr.c 2>/dev/null || true
          
          # 4. UFS driver
          echo "Checking UFS..."
          git checkout upstream/android-4.19-stable -- drivers/scsi/ufs/ufshcd.c 2>/dev/null || true
          
          # 5. DWC3 USB
          echo "Checking DWC3..."
          git checkout upstream/android-4.19-stable -- drivers/usb/dwc3/core.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- drivers/usb/dwc3/core.h 2>/dev/null || true
          
          # 6. Other drivers
          echo "Checking other drivers..."
          git checkout upstream/android-4.19-stable -- drivers/clk/qcom/clk-alpha-pll.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- drivers/mmc/core/mmc_test.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- drivers/net/usb/ax88179_178a.c 2>/dev/null || true
          git checkout upstream/android-4.19-stable -- drivers/rpmsg/qcom_glink_native.c 2>/dev/null || true
          
          # 7. QRTR
          echo "Checking QRTR..."
          git checkout upstream/android-4.19-stable -- net/qrtr/qrtr.c 2>/dev/null || true
          
          # 8. Documentation
          echo "Checking docs..."
          git checkout upstream/android-4.19-stable -- Documentation/arm64/silicon-errata.txt 2>/dev/null || true
          
          # Clean up any leftover conflict markers
          echo "Cleaning up conflict markers..."
          find . -name "*.c" -o -name "*.h" | xargs grep -l "<<<<<<< HEAD" 2>/dev/null | while read f; do
            echo "Still has markers: $f"
            # For files with markers, take upstream version
            git checkout upstream/android-4.19-stable -- "$f" 2>/dev/null || true
          done

      - name: Verify no conflict markers remain
        run: |
          echo "Checking for remaining conflict markers..."
          MARKERS=$(find . -name "*.c" -o -name "*.h" | xargs grep -l "<<<<<<< HEAD" 2>/dev/null | wc -l)
          echo "Files with markers: $MARKERS"
          if [ "$MARKERS" -gt 0 ]; then
            echo "WARNING: Some files still have conflict markers!"
            find . -name "*.c" -o -name "*.h" | xargs grep -l "<<<<<<< HEAD" 2>/dev/null
          fi

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Resolve merge conflicts - merge upstream android-4.19-stable" --allow-empty
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin resolve-conflicts --force
